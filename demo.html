<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>变画卡 · 整张同变版</title>
<style>
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;
       background:radial-gradient(1200px 800px at 50% 0%,#1b1f2e,#0b0d14 60%,#06070b);
       color:#cfd6e6;font:13.5px/1.55 "Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
  h1{font-size:14px;font-weight:600;letter-spacing:.14em;color:#8fa0c0;margin:0}
  .stage{perspective:1500px}
  .wrap{position:relative;border-radius:14px;overflow:hidden;cursor:grab;touch-action:none;
        box-shadow:0 26px 60px rgba(0,0,0,.7),0 0 0 1px rgba(140,170,255,.16) inset;will-change:transform}
  .wrap.drag{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}
  .ridge{position:absolute;inset:0;pointer-events:none;opacity:.15;mix-blend-mode:overlay;
         background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 1px,rgba(0,0,0,.5) 1px 2px)}
  .sheen{position:absolute;inset:-15% 0;pointer-events:none;mix-blend-mode:screen;filter:blur(2px);
         background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.34) 50%,transparent 66%)}
  .vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(125% 105% at 50% 45%,transparent 52%,rgba(0,0,0,.5) 100%)}
  .loading{position:absolute;left:0;right:0;bottom:0;padding:8px 12px 10px;display:flex;align-items:center;gap:10px;
           background:linear-gradient(0deg,rgba(6,8,14,.92),rgba(6,8,14,0));color:#93a1bd;font-size:12px}
  .loading .bar{flex:1;height:4px;border-radius:3px;background:#1e2536;overflow:hidden}
  .loading .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#5b8cff,#c86bff);transition:width .25s}
  .hud{display:flex;gap:16px;align-items:center;color:#7f8ba6;font-variant-numeric:tabular-nums}
  .hud b{color:#dbe4f5}
  button{background:#171c29;color:#c8d4ea;border:1px solid #2b3450;border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
  button:hover{background:#1e2540;border-color:#3d4a72;color:#fff}
  .panel{display:flex;gap:18px;align-items:center;background:#101423;border:1px solid #202942;border-radius:11px;padding:8px 15px;color:#8b98b6;font-size:12.5px;flex-wrap:wrap;justify-content:center}
  .panel label{display:flex;gap:7px;align-items:center}
  input[type=range]{width:130px;accent-color:#5b8cff}
  .tip{color:#5c6a86;font-size:12px;text-align:center;padding:0 12px}
</style></head><body>
<h1>变 画 卡</h1>
<div class="stage"><div class="wrap" id="wrap">
  <canvas id="cv"></canvas>
  <div class="loading" id="loading"><span>正在加载画面…</span><span class="bar"><i id="pbar"></i></span></div>
  <div class="ridge"></div><div class="sheen" id="sheen"></div><div class="vig"></div>
</div></div>
<div class="hud">
  <span>倾斜 <b id="ang">0°</b></span>
  <span>A <b id="ra">100%</b> : B <b id="rb">0%</b></span>
  <button id="auto">自动晃动</button><button id="reset">回正</button>
</div>
<div class="panel">
  <label>过渡快慢 <input id="G" type="range" min="0.4" max="2.5" step="0.1" value="1"><b id="Gv">1.0</b></label>
  <label>中心死区 <input id="D" type="range" min="0" max="40" step="1" value="8"><b id="Dv">8%</b></label>
  <label>条纹粗细 <input id="S" type="range" min="1" max="4" step="1" value="1"><b id="Sv">1px</b></label>
</div>
<div class="tip">中间是完整的一张；往左或往右倾斜，另一张才开始一点点浮出来（整张同时变，不是扫过去）· 电脑上拖动 / 手机上手指拖动</div>

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap'), sheen=document.getElementById('sheen');
const angEl=document.getElementById('ang'), raEl=document.getElementById('ra'), rbEl=document.getElementById('rb');
const loading=document.getElementById('loading'), pbar=document.getElementById('pbar');
let t=0.0, GAIN=1.0, DEAD=0.08, PITCH=1, dragging=false, sx0=0, st0=0, auto=false, ready=0;
let viewW=W, viewH=H, gotA=false, gotB=false;
const GOLD=0.6180339887498949, MAX=26;

function layout(){
  const k=Math.min((innerWidth-60)/W,(innerHeight-230)/H,1.6);
  viewW=Math.round(W*k); viewH=Math.round(H*k);
  cv.width=viewW; cv.height=viewH; cv.style.width=viewW+'px'; cv.style.height=viewH+'px';
  wrap.style.width=viewW+'px'; wrap.style.height=viewH+'px';
  ctx.setTransform(1,0,0,1,0,0); draw();
}
function progress(){
  let p=0;
  if(gotA) p+=50; if(gotB) p+=50;
  pbar.style.width=p+'%';
  if(p>=100){ loading.style.display='none'; }
}
const imgA=new Image(), imgB=new Image();
imgA.onload=()=>{gotA=true;progress();ready++;layout()};
imgB.onload=()=>{gotB=true;progress();ready++;layout()};
imgA.src=A; imgB.src=B;
progress();

function ratioB(){
  const a=Math.min(1,Math.abs(t));
  if(a<=DEAD) return 0;
  const u=(a-DEAD)/(1-DEAD);
  return Math.min(1, Math.pow(u,GAIN));
}
function draw(){
  if(ready<1) return;
  if(ready<2){ ctx.drawImage(imgA,0,0,imgA.width,imgA.height,0,0,viewW,viewH); return; }
  const a=ratioB(), pitch=Math.max(1,PITCH);
  let x=0;
  while(x<viewW){
    const wantB=((x*GOLD)%1)<a;
    let x2=x+pitch;
    while(x2<viewW && ((((x2*GOLD)%1)<a)===wantB)) x2+=pitch;
    const dw=Math.min(x2,viewW)-x;
    const img=wantB?imgB:imgA;
    ctx.drawImage(img,x/viewW*img.width,0,dw/viewW*img.width,img.height,x,0,dw,viewH);
    x+=dw;
  }
  const ang=t*MAX;
  angEl.textContent=(Math.abs(ang)<0.5?0:ang).toFixed(0)+'°';
  raEl.textContent=Math.round((1-a)*100)+'%'; rbEl.textContent=Math.round(a*100)+'%';
  wrap.style.transform=`rotateY(${(-ang).toFixed(2)}deg) rotateX(${(Math.abs(t)).toFixed(2)}deg)`;
  sheen.style.transform=`translateX(${(t*46).toFixed(1)}%)`;
}
function setT(v){ t=Math.max(-1,Math.min(1,v)); draw(); }
wrap.addEventListener('pointerdown',e=>{dragging=true;auto=false;wrap.classList.add('drag');sx0=e.clientX;st0=t;wrap.setPointerCapture&&wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{ if(dragging){ e.preventDefault&&e.preventDefault(); setT(st0+(e.clientX-sx0)/260);} });
addEventListener('pointerup',()=>{dragging=false;wrap.classList.remove('drag')});
addEventListener('pointercancel',()=>{dragging=false;wrap.classList.remove('drag')});
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){auto=false;setT(t-0.05)} if(e.key==='ArrowRight'){auto=false;setT(t+0.05)} if(e.key==='r'||e.key==='R')setT(0) });
addEventListener('resize',layout);
document.getElementById('reset').onclick=()=>{auto=false;setT(0)};
document.getElementById('auto').onclick=()=>{auto=!auto};
const gEl=document.getElementById('G'), dEl=document.getElementById('D'), sEl=document.getElementById('S');
gEl.oninput=()=>{GAIN=+gEl.value;document.getElementById('Gv').textContent=GAIN.toFixed(1);draw()};
dEl.oninput=()=>{DEAD=+dEl.value/100;document.getElementById('Dv').textContent=dEl.value+'%';draw()};
sEl.oninput=()=>{PITCH=+sEl.value;document.getElementById('Sv').textContent=sEl.value+'px';draw()};
(function tick(now){ if(auto) setT(Math.sin(now/1400)); requestAnimationFrame(tick); })(performance.now());
</script></body></html>
